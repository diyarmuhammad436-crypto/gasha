<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>♥</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff4fd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#000;color:#fff;overflow:hidden;font-family:'Press Start 2P',ui-monospace,Menlo,monospace}
canvas#rain{position:fixed;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.5s}
.stage{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
.win{width:min(88vw,420px);min-height:230px;border:3px double #fff;box-shadow:10px 10px 0 #222;background:#000;position:relative}
.bar{border-bottom:3px solid #fff;padding:6px 10px;font-size:10px;letter-spacing:4px}
.msg{padding:34px 18px 18px;text-align:center;font-size:14px;line-height:1.9;min-height:86px}
.cur{display:inline-block;width:10px;height:16px;background:#fff;vertical-align:middle;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.btns{display:flex;gap:18px;justify-content:center;padding:0 0 26px;opacity:0;transition:opacity .4s;height:46px}
.btns.show{opacity:1}
button{font:inherit;font-size:12px;color:#fff;background:#000;border:3px solid #fff;padding:10px 16px;cursor:pointer}
button:hover,button:active{background:#fff;color:#000}
#no{position:relative;transition:transform .15s}
.love{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.love h1{margin:0;font-size:clamp(22px,8vw,40px);color:#ffd9f6;text-shadow:0 0 6px #fff,0 0 14px var(--pink),0 0 32px var(--pink),0 0 60px var(--pink);animation:fl 3s infinite}
@keyframes fl{0%,92%,100%{opacity:1}94%{opacity:.6}96%{opacity:1}98%{opacity:.7}}
#heart{width:min(60vw,260px);height:min(60vw,260px)}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px)}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="stage">
  <div class="win" id="win">
    <div class="bar">▫▫▫</div>
    <div class="msg"><span id="t"></span><span class="cur"></span></div>
    <div class="btns" id="btns"><button id="yes">Yes</button><button id="no">No</button></div>
  </div>
  <div class="love" id="love"><h1 id="lt"></h1><canvas id="heart" width="520" height="520"></canvas></div>
</div>
<div class="scan"></div>
<script>
// ===== Change these two lines to edit the texts =====
var QUESTION = "Do you want to be my girlfriend?";
var LOVE_TEXT = "LOVE YOU";
// ====================================================
var $ = function(i){return document.getElementById(i)};
document.getElementById('lt').textContent = LOVE_TEXT;

// typing effect
var i = 0, t = $('t');
(function type(){
  if(i <= QUESTION.length){ t.textContent = QUESTION.slice(0,i++); setTimeout(type, 95); }
  else $('btns').classList.add('show');
})();

// "No" runs away
var no = $('no');
function dodge(e){
  e.preventDefault();
  var dx = (Math.random()-.5)*160, dy = (Math.random()-.5)*120;
  no.style.transform = 'translate('+dx+'px,'+dy+'px)';
}
no.addEventListener('mouseenter', dodge);
no.addEventListener('touchstart', dodge, {passive:false});
no.addEventListener('click', dodge);

// Yes -> love scene
$('yes').addEventListener('click', function(){
  $('win').style.display = 'none';
  $('love').style.display = 'flex';
  $('rain').style.opacity = 1;
  startRain(); startHeart();
});

// matrix rain
var rc = $('rain'), rx = rc.getContext('2d'), drops = [], running = false;
var CH = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$#@%&*+<>♥'.split('');
function size(){ rc.width = innerWidth; rc.height = innerHeight; drops = Array(Math.ceil(rc.width/20)).fill(0).map(function(){return Math.random()*-50}); }
addEventListener('resize', size);
function startRain(){
  if(running) return; running = true; size();
  setInterval(function(){
    rx.fillStyle = 'rgba(0,0,0,.12)'; rx.fillRect(0,0,rc.width,rc.height);
    rx.font = '18px monospace';
    drops.forEach(function(y,k){
      var c = CH[Math.floor(Math.random()*CH.length)];
      rx.fillStyle = Math.random()<.06 ? '#fff' : '#ff4fd8';
      rx.fillText(c, k*20, y*20);
      drops[k] = (y*20 > rc.height && Math.random() > .975) ? 0 : y+1;
    });
  }, 55);
}

// glowing heart (parametric heart formula from the video)
function startHeart(){
  var c = $('heart'), x = c.getContext('2d'), s = 0;
  (function draw(){
    s += .05; var k = 12 + Math.sin(s)*.9;
    x.clearRect(0,0,c.width,c.height);
    x.shadowColor = '#ff4fd8'; x.shadowBlur = 50; x.fillStyle = '#ffa6ec';
    x.beginPath();
    for(var a = 0; a <= Math.PI*2; a += .02){
      var px = 16*Math.pow(Math.sin(a),3);
      var py = 13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);
      var X = c.width/2 + px*k, Y = c.height/2 - py*k + 10;
      a===0 ? x.moveTo(X,Y) : x.lineTo(X,Y);
    }
    x.closePath(); x.fill();
    requestAnimationFrame(draw);
  })();
}
</script>
</body>
</html>
