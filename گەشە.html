<!DOCTYPE html>
<html lang="ckb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>گەشە</title>
<style>
:root{--bg:#000;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,S,cx,cy,dpr=Math.min(devicePixelRatio||1,2);
const SHADES=['#ef4444','#f87171','#fca5a5','#dc2626','#b91c1c','#fecaca'];
let parts=[],bursts=[],base=[];
const N=2600;
function heartPoint(){
  const t=Math.random()*Math.PI*2;
  const x=16*Math.pow(Math.sin(t),3);
  const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
  const k=Math.sqrt(Math.random());
  return [x*k,y*k];
}
function resize(){
  W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W,H*0.6)/40;cx=W/2;cy=H*0.38;
  parts=[];
  for(let i=0;i<N;i++){
    const [hx,hy]=heartPoint();
    const X=cx+hx*S,Y=cy+hy*S;
    parts.push({x:X,y:Y,hx,hy,vx:0,vy:0,ph:Math.random()*6.28,
      c:SHADES[Math.random()*SHADES.length|0],s:Math.random()*1.4+0.5});
  }
  base=[];
  for(let i=0;i<500;i++)base.push({a:Math.random()*6.28,r:Math.random(),sp:0.2+Math.random()*0.8,h:Math.random()});
}
addEventListener('resize',()=>{resize();buildText()});resize();

function burstAt(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28,s=2+Math.random()*7;
    bursts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:0.012+Math.random()*0.02,
      c:SHADES[Math.random()*SHADES.length|0]});
  }
}
let ptr=null,mode='heart',modeT=0;
const WORD='گەشە';
let tpts=[];
function buildText(){
  const o=document.createElement('canvas');o.width=W;o.height=H;
  const c=o.getContext('2d');
  let fs=H*0.2;
  const fam='"Noto Naskh Arabic","Noto Sans Arabic","Geeza Pro","Tahoma","Arial",sans-serif';
  c.direction='rtl';c.textAlign='center';c.textBaseline='middle';
  c.font='bold '+fs+'px '+fam;
  const w=c.measureText(WORD).width;
  fs=fs*Math.min(1,(W*0.8)/w);
  c.font='bold '+fs+'px '+fam;
  c.fillStyle='#fff';c.fillText(WORD,W/2,cy+S*2);
  const d=c.getImageData(0,0,W,H).data;tpts=[];
  const st=Math.max(2,Math.round(W/260));
  for(let y=0;y<H;y+=st)for(let x=0;x<W;x+=st){if(d[(y*W+x)*4+3]>128)tpts.push([x,y])}
  parts.forEach((p,i)=>{const q=tpts[(Math.random()*tpts.length)|0]||[cx,cy];p.tx=q[0]+(Math.random()-.5)*st;p.ty=q[1]+(Math.random()-.5)*st});
}
buildText();
function explode(px,py){
  burstAt(px,py,90);
  for(const p of parts){
    const dx=p.x-px,dy=p.y-py,d=Math.hypot(dx,dy)+1;
    const f=Math.max(0,1-d/(S*22))*14+Math.random()*3;
    p.vx+=dx/d*f+(Math.random()-.5)*6;p.vy+=dy/d*f+(Math.random()-.5)*6;
  }
}
function pos(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',e=>{
  ptr=pos(e);explode(ptr.x,ptr.y);
  mode='text';modeT=performance.now();
});
cv.addEventListener('pointermove',e=>{ptr=pos(e);if(e.buttons||e.pointerType==='touch')burstAt(ptr.x,ptr.y,3)});
cv.addEventListener('pointerup',()=>ptr=null);
cv.addEventListener('pointerleave',()=>ptr=null);

let t0=performance.now();
function frame(now){
  const t=(now-t0)/1000;
  if(mode==='text'&&performance.now()-modeT>4500){mode='heart';explode(cx,cy)}
  const beat=1+Math.sin(t*2.4)*0.025;
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  // glowing base
  const by=H*0.38+S*17+S*3, bw=S*15;
  const g=ctx.createRadialGradient(cx,by,0,cx,by,bw);
  g.addColorStop(0,'rgba(255,90,90,0.55)');g.addColorStop(0.5,'rgba(239,68,68,0.22)');g.addColorStop(1,'rgba(239,68,68,0)');
  ctx.save();ctx.translate(cx,by);ctx.scale(1,0.3);ctx.translate(-cx,-by);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,by,bw,0,6.28);ctx.fill();ctx.restore();
  for(const b of base){
    b.a+=0.012*b.sp;b.h=(b.h+0.004*b.sp)%1;
    const rr=bw*(0.3+b.r*0.7)*0.9;
    const x=cx+Math.cos(b.a)*rr,y=by-b.h*S*5+Math.sin(b.a)*rr*0.3;
    ctx.globalAlpha=(1-b.h)*0.8;ctx.fillStyle=b.r>.5?'#fca5a5':'#f87171';
    ctx.fillRect(x,y,1.6,1.6);
  }

  // heart particles
  for(const p of parts){
    const tx=mode==='text'?p.tx+Math.sin(t*2+p.ph)*0.6:cx+p.hx*S*beat+Math.sin(t*1.3+p.ph)*1.2;
    const ty=mode==='text'?p.ty+Math.cos(t*2+p.ph)*0.6:cy+p.hy*S*beat+Math.cos(t*1.1+p.ph)*1.2;
    p.vx+=(tx-p.x)*0.035;p.vy+=(ty-p.y)*0.035;
    if(ptr){
      const dx=p.x-ptr.x,dy=p.y-ptr.y,d=Math.hypot(dx,dy)+1;
      if(d<S*6){const f=(1-d/(S*6))*2.2;p.vx+=dx/d*f;p.vy+=dy/d*f}
    }
    p.vx*=0.9;p.vy*=0.9;p.x+=p.vx;p.y+=p.vy;
    const sp=Math.hypot(p.vx,p.vy);
    ctx.globalAlpha=Math.min(1,0.55+sp*0.1+Math.sin(t*3+p.ph)*0.2);
    ctx.fillStyle=p.c;
    const s=p.s+Math.min(sp*0.15,1.5);
    ctx.fillRect(p.x,p.y,s,s);
    if(sp>2.5){ctx.strokeStyle=p.c;ctx.globalAlpha=0.35;ctx.lineWidth=0.8;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2.5,p.y-p.vy*2.5);ctx.stroke()}
  }
  // burst streaks
  for(let i=bursts.length-1;i>=0;i--){
    const b=bursts[i];b.x+=b.vx;b.y+=b.vy;b.vx*=0.96;b.vy*=0.96;b.l-=b.d;
    if(b.l<=0){bursts.splice(i,1);continue}
    ctx.globalAlpha=b.l;ctx.strokeStyle=b.c;ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*3,b.y-b.vy*3);ctx.stroke();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
requestAnimationFrame(frame);
</script>
</body>
</html>
